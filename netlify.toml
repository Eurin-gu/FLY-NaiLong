# Netlify — https://app.netlify.com/start
# The build writes dist/_headers and dist/_redirects, which Netlify picks up
# automatically, so no header rules are duplicated here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set SITE_URL to your custom domain to enable canonical/og:url/sitemap:
  # SITE_URL = "https://your-domain.example"
